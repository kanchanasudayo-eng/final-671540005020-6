<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้าน KSU Coffee</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e9eef5 0%, #d5e0ea 100%);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
        }
        .banner {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .content {
            padding: 28px 32px 32px 32px;
        }
        h1 {
            color: #3b2314;
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 26px;
            font-weight: 800;
        }
        .student-id {
            color: #7f8c8d;
            font-size: 14px;
            margin: 2px 0 10px 0;
        }
        .version {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0284c7;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        h2 {
            color: #2c3e50;
            font-size: 19px;
            font-weight: 700;
            border-bottom: 1px solid #f1f3f5;
            padding-bottom: 10px;
            margin-bottom: 16px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            background: #fdfbf7;
            border: 1px solid #f5ede0;
            margin: 10px 0;
            padding: 12px 18px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            font-weight: 600;
            color: #4a3b32;
            font-size: 15px;
        }
        li span.icon {
            margin-right: 14px;
            font-size: 18px;
        }
        .promo-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 24px;
            padding: 13px 0;
            background: #d9383a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(217, 56, 58, 0.35);
            transition: background 0.2s, transform 0.1s;
            box-sizing: border-box;
        }
        .promo-btn:hover {
            background: #c82333;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?q=80&w=800&auto=format&fit=crop" alt="Coffee Banner" class="banner">
        <div class="content">
            <h1>ร้าน KSU Coffee</h1>
            <p class="student-id">รหัสนักศึกษา: 671540005020-6</p>
            <div class="version">Promo v1</div>
            
            <h2>รายการเมนู</h2>
            <ul>
                <li><span class="icon">☕</span> Espresso - 50 บาท</li>
                <li><span class="icon">🥛</span> Iced Latte - 65 บาท</li>
                <li><span class="icon">🍵</span> Green Tea - 55 บาท</li>
                <li><span class="icon">🧋</span> Thai Tea - 60 บาท</li>
            </ul>

            <a href="http://localhost:8083" class="promo-btn">ดูโปรโมชั่น</a>
        </div>
    </div>
</body>
</html>
